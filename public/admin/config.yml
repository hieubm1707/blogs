backend:
  name: git-gateway
  repo: hieubm1707/blogs
  branch: main

# Local mode: with `pnpm cms:proxy`, the CMS writes files directly instead of going through the GitHub API
local_backend: true

# Where uploaded images are stored and the public path they are served from
media_folder: 'public/images'
public_folder: '/images'

collections:
  - name: 'posts'
    label: 'Posts'
    folder: 'posts'
    create: true
    slug: '{{slug}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Publish date', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: 'Body', name: 'body', widget: 'markdown' }
